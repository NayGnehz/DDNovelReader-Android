name: Build Android APK

on:
  push:
    branches: [master, codex/reader-gestures]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore dependencies
        run: flutter pub get
      - name: Test reader gestures
        run: flutter test test/reader_gestures_test.dart
      - name: Restore Gradle wrapper
        run: |
          flutter create --platforms=android --project-name wrapper_seed /tmp/wrapper_seed
          cp /tmp/wrapper_seed/android/gradlew android/gradlew
          cp /tmp/wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
      - name: Build installable APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: DDNovelReader-gestures-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
